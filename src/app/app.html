<nav>
  <ul class="pagination">
    <li class="page-item" [appClass]="{disabled: currentPage == 0}">
      <a class="page-link" (click)="currentPage = currentPage - 1">Prev</a>
    </li>
    <ng-container>
    @for (image of images; track $index) {
      @if (checkWindowIndex($index)){
      <li [appClass]="{'active': $index === currentPage}">
        <a (click)="currentPage = $index" class="page-link">{{ $index + 1 }}</a>
      </li>
      }}
      </ng-container>
    <li class="page-item" [appClass]="{disabled: currentPage == images.length - 1}">
      <a class="page-link" (click)="currentPage = currentPage + 1">Next</a>
    </li>
  </ul>
</nav>
<div >
  <h4> {{ images[currentPage].title}} </h4>
  <img [src]="images[currentPage].url" alt="unsplash.com">
</div>
