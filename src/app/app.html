<nav>
  <ul class="pagination">
    <li class="page-item" [class]="{disabled: currentPage == 0}">
      <a class="page-link" (click)="currentPage = currentPage - 1">Prev</a>
    </li>
    @for (image of images; track $index) {
    <li [class]="{'active': $index === currentPage}">
      <a (click)="currentPage = $index" class="page-link" (click)="currentPage = $index">{{ $index + 1 }}</a></li>
    }
     <li class="page-item" [class]="{disabled: currentPage == images.length - 1}">
      <a class="page-link" (click)="currentPage = currentPage + 1">Next</a>
    </li>
  </ul>
</nav>
